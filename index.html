<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="Sinal IPTV — experiência premium de entretenimento.">
  <title>Sinal IPTV</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header id="mainHeader" class="mainHeader hidden">

    <button class="brand" onclick="showHome()">

      <span class="mark">
        <i></i>
        <i></i>
        <i></i>
      </span>

      <span>
        SINAL
        <small>IPTV</small>
      </span>

    </button>

    <nav>

      <button id="homeNav" class="active" onclick="showHome()">
        Início
      </button>

      <button id="liveNav" onclick="showLive()">
        Ao vivo
      </button>

      <button id="moviesNav" onclick="showMovies()">
        Filmes
      </button>

      <button id="seriesNav" onclick="showSeries()">
        Séries
      </button>

      <button id="listNav" onclick="showList()">
        Minha lista
      </button>

    </nav>

    <div class="headerRight">

      <div class="search">
        <span>⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar..."
          autocomplete="off"
        >
      </div>

      <button
        class="playlistButton"
        onclick="showPlaylistManager()"
      >
        + Playlist
      </button>

      <button class="profile">
        <span class="avatar">S</span>
      </button>

    </div>

  </header>


  <!-- =========================
       APP
  ========================== -->

  <div id="app"></div>


  <!-- =========================
       PLAYER MODAL
  ========================== -->

  <div
    id="playerModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modalBox">

      <button
        class="close"
        onclick="closePlayer()"
      >
        ×
      </button>

      <div class="modalPlayer">

        <video
          id="modalVideo"
          controls
          playsinline
          preload="metadata"
        ></video>

        <div
          id="playerFallback"
          class="videoPlaceholder hidden"
        >
          <div class="playerIcon">▶</div>

          <strong>
            Reprodução indisponível
          </strong>

          <span>
            O navegador não conseguiu reproduzir
            essa fonte diretamente.
          </span>
        </div>

      </div>

      <div class="playerInformation">

        <div>

          <small id="modalGroup">
            AO VIVO
          </small>

          <h2 id="modalTitle">
            Sinal IPTV
          </h2>

          <p id="modalDesc"></p>

        </div>

        <button
          id="modalFavorite"
          class="playerFavorite"
        >
          ＋ Minha lista
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       TOAST
  ========================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
