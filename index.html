<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="description" content="Sinal IPTV — sua central premium de entretenimento.">
<title>Sinal IPTV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<button class="brand" onclick="showHome()"><span class="mark"><i></i><i></i><i></i></span><span>SINAL<small>IPTV</small></span></button>

<nav>
<button id="homeNav" class="active" onclick="showHome()">Início</button>
<button id="liveNav" onclick="showLive()">Ao vivo</button>
<button id="listNav" onclick="showList()">Minha lista</button>
<button onclick="showManager()">Playlist</button>
</nav>

<div class="headerRight">
<div class="search">⌕<input id="searchInput" placeholder="Buscar..." autocomplete="off"></div>
<button class="profile"><span class="avatar">G</span> Guilherme</button>
</div>
</header>

<div id="app"></div>

<footer>
<span class="brand footerBrand">
<span class="mark"><i></i><i></i><i></i></span>
<span>SINAL<small>IPTV</small></span>
</span>
<span>Experiência premium de entretenimento.</span>
<span>© 2026 Sinal IPTV</span>
</footer>

<div class="modal" id="playerModal">
<div class="modalBox">
<button class="close" onclick="closePlayer()">×</button>

<div class="modalPlayer">
<video id="modalVideo" controls playsinline></video>

<div id="playerFallback" class="videoPlaceholder hidden">
<strong>Não foi possível reproduzir esta fonte.</strong>
<span>Verifique a URL/codec ou tente outro canal.</span>
</div>
</div>

<h2 class="modalTitle" id="modalTitle"></h2>
<p class="modalDesc" id="modalDesc"></p>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
